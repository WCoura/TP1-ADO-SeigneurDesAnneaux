<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <rect width="980" height="520" fill="#f7f3ea"/>
  <text x="490" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#3d2b1f">Schéma relationnel  TP1_LSDA</text>
  <text x="490" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5c4a3a">Réservations de lieux  Seigneur des Anneaux</text>

  <!-- Lieu -->
  <rect x="40" y="100" width="250" height="250" rx="8" fill="#fff" stroke="#3d2b1f" stroke-width="2"/>
  <rect x="40" y="100" width="250" height="36" rx="8" fill="#2f5d50"/>
  <rect x="40" y="120" width="250" height="16" fill="#2f5d50"/>
  <text x="165" y="124" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">Lieu</text>
  <text x="56" y="160" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">PK  IdLieu INT IDENTITY</text>
  <line x1="56" y1="172" x2="274" y2="172" stroke="#c8b89a"/>
  <text x="56" y="196" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">UQ  NomLieu NVARCHAR(100)</text>
  <text x="56" y="220" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">    Royaume NVARCHAR(80)</text>
  <text x="56" y="244" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">CK  Dangerosite INT 1..10</text>
  <text x="56" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b5a48">Un lieu ne peut pas être</text>
  <text x="56" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b5a48">occupé par deux missions</text>
  <text x="56" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b5a48">qui se chevauchent.</text>

  <!-- Personnage -->
  <rect x="690" y="100" width="250" height="250" rx="8" fill="#fff" stroke="#3d2b1f" stroke-width="2"/>
  <rect x="690" y="100" width="250" height="36" rx="8" fill="#2f5d50"/>
  <rect x="690" y="120" width="250" height="16" fill="#2f5d50"/>
  <text x="815" y="124" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">Personnage</text>
  <text x="706" y="160" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">PK  IdPersonnage INT IDENTITY</text>
  <line x1="706" y1="172" x2="924" y2="172" stroke="#c8b89a"/>
  <text x="706" y="196" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">UQ  Nom NVARCHAR(100)</text>
  <text x="706" y="220" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">    Race NVARCHAR(50)</text>
  <text x="706" y="244" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">    Faction NVARCHAR(80)</text>

  <!-- Mission -->
  <rect x="365" y="170" width="250" height="250" rx="8" fill="#fff" stroke="#3d2b1f" stroke-width="2"/>
  <rect x="365" y="170" width="250" height="36" rx="8" fill="#7a4e1d"/>
  <rect x="365" y="190" width="250" height="16" fill="#7a4e1d"/>
  <text x="490" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">Mission</text>
  <text x="381" y="230" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">PK  IdMission INT IDENTITY</text>
  <line x1="381" y1="242" x2="599" y2="242" stroke="#c8b89a"/>
  <text x="381" y="266" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">FK  IdLieu INT</text>
  <text x="381" y="290" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">FK  IdPersonnage INT</text>
  <text x="381" y="314" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">    DateDebut DATETIME2</text>
  <text x="381" y="338" font-family="Consolas, monospace" font-size="13" fill="#3d2b1f">    DateFin DATETIME2</text>
  <text x="381" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b5a48">CK DateFin &gt; DateDebut</text>
  <text x="381" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b5a48">Chevauchement contrôlé en C#</text>
  <text x="381" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b5a48">(requête paramétrée + DataReader)</text>

  <!-- Relations -->
  <line x1="290" y1="200" x2="365" y2="270" stroke="#7a4e1d" stroke-width="2"/>
  <polygon points="365,270 351,261 350,275" fill="#7a4e1d"/>
  <text x="300" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7a4e1d">1</text>
  <text x="338" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7a4e1d">N</text>

  <line x1="690" y1="200" x2="615" y2="270" stroke="#7a4e1d" stroke-width="2"/>
  <polygon points="615,270 629,261 630,275" fill="#7a4e1d"/>
  <text x="668" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7a4e1d">1</text>
  <text x="628" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7a4e1d">N</text>

  <text x="490" y="500" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5c4a3a">Cardinalités : un lieu et un personnage peuvent participer à plusieurs missions.</text>
</svg>
